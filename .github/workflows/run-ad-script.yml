name: Run AD.sh Script

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Run AD.sh script
      run: |
        chmod +x shell/AD.sh
        ./shell/AD.sh
