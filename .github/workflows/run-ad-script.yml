name: AD Rules Maintenance

on:
  push:
    branches: [ "main" ]
    paths:
      - 'shell/AD.sh'
      - '.github/workflows/ad-rules.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: '触发原因 (可选)'
        required: false
        default: '日常更新'

env:
  OUTPUT_FILE: ${{ github.workspace }}/AD.txt
  CACHE_KEY: ${{ runner.os }}-apt-${{ hashFiles('**/apt-packages.txt') }}

jobs:
  maintain-ad-rules:
    name: Update AD Rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Cache APT packages
        uses: actions/cache@v3
        id: apt-cache
        with:
          path: /var/cache/apt/archives
          key: ${{ env.CACHE_KEY }}

      - name: Install dependencies
        run: |
          sudo apt-get -q update
          sudo apt-get -q install -y \
            wget \
            curl \
            file \
            coreutils
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Validate script permissions
        run: |
          if [ ! -x "shell/AD.sh" ]; then
            echo "::error::AD.sh is not executable"
            exit 1
          fi
          echo "Script permissions verified"

      - name: Execute maintenance script
        id: run-script
        run: |
          export LC_ALL=C.UTF-8
          set -eo pipefail
          ./shell/AD.sh 2>&1 | tee -a run.log
          
          # Capture script execution time
          echo "duration=$(($(date +%s) - $(date +%s -r run.log)))" >> $GITHUB_OUTPUT
        working-directory: ./shell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: execution-logs
          path: |
            shell/run.log
            ${{ env.OUTPUT_FILE }}

      - name: Validate output
        id: validate
        run: |
          # Basic file checks
          if [ ! -f "${{ env.OUTPUT_FILE }}" ]; then
            echo "::error::Output file missing"
            exit 1
          fi

          # Content validation
          EMPTY_LINES=$(grep -c '^[[:space:]]*$' "${{ env.OUTPUT_FILE }}" || true)
          INVALID_ENTRIES=$(grep -cvE '^(\|\|)?[a-zA-Z0-9-]+\.[a-zA-Z]{2,}\^?$' "${{ env.OUTPUT_FILE }}" || true)
          
          echo "file_size=$(du -h "${{ env.OUTPUT_FILE }}" | cut -f1)" >> $GITHUB_OUTPUT
          echo "entry_count=$(wc -l < "${{ env.OUTPUT_FILE }}")" >> $GITHUB_OUTPUT
          echo "empty_lines=$EMPTY_LINES" >> $GITHUB_OUTPUT
          echo "invalid_entries=$INVALID_ENTRIES" >> $GITHUB_OUTPUT

          if [ $INVALID_ENTRIES -gt 0 ]; then
            echo "::warning::Found $INVALID_ENTRIES invalid entries"
          fi

      - name: Commit changes
        if: steps.validate.outputs.entry_count > 0
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          git add ${{ env.OUTPUT_FILE }}
          git commit -m "chore: Update AD rules (${{ steps.validate.outputs.entry_count }} entries)"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-execution report
        if: always()
        run: |
          echo "=== Execution Summary ==="
          echo "Duration: ${{ steps.run-script.outputs.duration }} seconds"
          echo "File Size: ${{ steps.validate.outputs.file_size }}"
          echo "Total Entries: ${{ steps.validate.outputs.entry_count }}"
          echo "Empty Lines: ${{ steps.validate.outputs.empty_lines }}"
          echo "Invalid Entries: ${{ steps.validate.outputs.invalid_entries }}"
          echo "========================="