name: Run AD.sh Script

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Check out repository
        uses: actions/checkout@v3

      # Step 2: Set up necessary dependencies (if any)
      - name: Install dependencies        run: |
          if [ -f "$HOME/AD.txt" ]; then
            echo "AD.txt file generated successfully."
          else
            echo "Error: AD.txt file not found."
            exit 1
          fi