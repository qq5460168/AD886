name: AD Rules Auto Update

on:
  push:
    branches: [ "main" ]
    paths:
      - 'shell/AD.sh'
      - 'apt-packages.txt'
  schedule:
    - cron: '0 12 * * *'  # 每天 UTC 时间 12:00 (北京时间 20:00)
  workflow_dispatch:
    inputs:
      force-update:
        description: '强制更新缓存'
        required: false
        type: boolean

env:
  CACHE_VERSION: v1
  OUTPUT_FILE: ${{ github.workspace }}/AD.txt

jobs:
  update-rules:
    name: Update Rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      # 步骤 1: 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 步骤 2: APT 缓存配置
      - name: Cache APT packages
        uses: actions/cache@v3
        id: apt-cache
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ env.CACHE_VERSION }}-${{ hashFiles('apt-packages.txt') }}
          restore-keys: |
            ${{ runner.os }}-apt-${{ env.CACHE_VERSION }}-

      # 步骤 3: 安装系统依赖
      - name: Install dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y $(grep -vE '^\s*#' apt-packages.txt | xargs)
        env:
          DEBIAN_FRONTEND: noninteractive

      # 步骤 4: 准备脚本环境
      - name: Prepare script
        run: |
          mkdir -p $HOME/.local/bin
          find shell/ -type f -name "*.sh" -exec chmod +x {} \;
          dos2unix shell/AD.sh

      # 步骤 5: 执行维护脚本
      - name: Run maintenance script
        id: run-script
        run: |
          export TMPDIR=$HOME/tmp
          mkdir -p $TMPDIR
          
          ./shell/AD.sh 2>&1 | tee -a run.log
          
          # 记录执行时间
          echo "duration=$(grep 'Script execution time' run.log | awk '{print $5}')" >> $GITHUB_OUTPUT
        env:
          LC_ALL: C.UTF-8

      # 步骤 6: 验证输出文件
      - name: Validate output
        id: validate
        run: |
          # 基础验证
          if [ ! -s "$OUTPUT_FILE" ]; then
            echo "::error::Output file is empty or missing"
            exit 1
          fi

          # 内容分析
          echo "=== 文件分析报告 ===" > report.md
          echo "- 文件大小: $(du -h $OUTPUT_FILE | cut -f1)" >> report.md
          echo "- 总行数: $(wc -l < $OUTPUT_FILE)" >> report.md
          echo "- 空行数: $(grep -c '^$' $OUTPUT_FILE)" >> report.md
          echo "- 有效域名: $(grep -cE '^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}$' $OUTPUT_FILE)" >> report.md

          # 生成质量评分
          valid_lines=$(grep -cE '^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}$' $OUTPUT_FILE)
          total_lines=$(wc -l < $OUTPUT_FILE)
          quality_score=$(( valid_lines * 100 / total_lines ))
          echo "quality_score=$quality_score" >> $GITHUB_OUTPUT

          # 上传分析报告
          echo "::notice title=质量报告::评分 ${quality_score}/100 (有效条目比例)"

      # 步骤 7: 提交变更
      - name: Commit changes
        if: |
          steps.validate.outputs.quality_score > 80 &&
          github.event_name != 'workflow_dispatch' 
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          git add $OUTPUT_FILE
          git commit -m "Auto-update: ${{ steps.validate.outputs.quality_score }}% 质量"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 步骤 8: 清理环境
      - name: Cleanup
        if: always()
        run: |
          sudo apt-get autoremove -y
          sudo rm -rf /var/lib/apt/lists/*