name: Update Rules and Run AD Script

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # 每 4 个小时运行一次
    - cron: '0 */4 * * *'

env:
  TZ: Asia/Shanghai
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub 提供的默认 Token

jobs:
  update-rules:
    name: Generate and Push Rules
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整提交历史

      - name: Generate Rules
        run: |
          set -euxo pipefail
          echo "Starting rule generation..."
          bash ./shell/make.sh
          echo "Rules generated successfully."

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 检测是否有变更
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git add .
          git commit -m "Automated update: $(date +'%Y-%m-%d %H:%M:%S %Z')"
          git push origin HEAD:main

      - name: Trigger Downstream Update
        env:
          GITHUBTOKEN: ${{ secrets.GITHUB_TOKEN }} # 确保脚本可以读取 GITHUBTOKEN
        run: |
          set -euxo pipefail
          echo "Triggering downstream repository update..."
          bash ./shell/manual-update.sh || {
            echo "Error occurred in manual-update.sh"
            exit 1
          }

  run-ad-script:
    name: Run AD.sh Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整提交历史

      - name: Run AD.sh
        run: |
          set -euxo pipefail
          echo "Starting AD.sh script..."
          bash ./shell/AD.sh || {
            echo "Error occurred in AD.sh"
            exit 1
          }
          echo "AD.sh script completed."
