name: Update Rules

on:
  push:
    paths:
      - 'AD.txt'
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # 中国时间10点，对应UTC时间2点

env:
  GITHUBTOKEN: ${{ secrets.GITHUBTOKEN }}

jobs:
  Pushed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Make Rules and Git push assets to github
        run: |
          bash ./shell/make.sh
          git init
          git config --local user.name "action"
          git config --local user.email "action@github.com"
          git branch -m main
          git add --all
          git commit -m "Updated at $(TZ=UTC-8 date +'%Y-%m-%d %H:%M:%S')（北京时间）"
          git push --force -u origin
      - name: Manual-Update AdRules Repository
        run: |
          bash ./shell/manual-update.sh
