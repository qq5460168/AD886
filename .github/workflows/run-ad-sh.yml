name: Run AD.sh Script

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # UTC时间每天00:00（对应北京时间08:00）

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Validate AD.sh Exists
        run: test -f shell/AD.sh || (echo "Error: AD.sh not found!" && exit 1)

      - name: Make AD.sh Executable
        run: chmod +x shell/AD.sh

      - name: Execute AD.sh
        run: |
          ./shell/AD.sh || exit 1  # 失败时退出