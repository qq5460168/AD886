name: Run AD.sh Script

on:
  workflow_dispatch: # 手动触发工作流
  schedule: # 定时触发工作流（可选）
    - cron: '0 0 * * *' # 每天 00:00 UTC 运行

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # 检出代码仓库
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 设置脚本执行权限
      - name: Make AD.sh Executable
        run: chmod +x /AD.sh

      # 运行脚本
      - name: Execute AD.sh
        run: |
          ./AD.sh