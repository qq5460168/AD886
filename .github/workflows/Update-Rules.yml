name: Update Rules

on:
  schedule:
    - cron: "0 12 * * *" # 每天中午12点运行
  workflow_dispatch:     # 手动触发工作流

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      # 检出代码库
      - name: Checkout repository
        uses: actions/checkout@v3

      # 设置时间区域（可选）
      - name: Set Timezone
        run: sudo timedatectl set-timezone Asia/Shanghai

      # 执行更新脚本
      - name: Run Update Script
        run: |
          #!/bin/sh

          # 获取合并规则的数量
          if [ -f "merged-filter.txt" ]; then
              num_rules=$(sed -n 's/^! Total count: //p' merged-filter.txt)
          else
              echo "Error: merged-filter.txt not found!" >&2
              exit 1
          fi

          # 获取当前时间（北京时间）
          time=$(TZ=UTC-8 date +'%Y-%m-%d %H:%M:%S')

          # 更新README.md中的更新时间
          if [ -f "README.md" ]; then
              sed -i "s/^更新时间:.*/更新时间: $time （北京时间） /g" README.md
              sed -i "s/^拦截规则数量:.*/拦截规则数量: $num_rules /g" README.md
          else
              echo "Error: README.md not found!" >&2
              exit 1
          fi

      # 提交更改到仓库
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README.md with latest rules and timestamp" || echo "No changes to commit"
          git push
