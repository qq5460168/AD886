name: Update Filter Rules

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 时间 0 点运行
  workflow_dispatch:      # 允许手动触发

jobs:
  merge-rules:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests

    - name: Run merge script
      run: |
        python merge_rules.py
        echo "规则更新时间: $(date -u '+%Y-%m-%d %H:%M:%S')" >> update.log

    - name: Commit changes  # 确保此步骤缩进在 jobs.merge-rules.steps 下
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "AutoUpdater[Bot]"
        git config --global user.email "916899380+autoupdater[bot]@users.noreply.github.com"
        git add merged-filter.txt update.log
        if [ -n "$(git status --porcelain)" ]; then
          git commit -m "自动更新规则: $(date -u '+%Y-%m-%d')"
          git push "https://${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        else
          echo "无变更可提交"
        fi