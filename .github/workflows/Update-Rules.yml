name: Update Filter Rules

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 时间 0 点运行（对应北京时间 8 点）
  workflow_dispatch:

jobs:
  merge-rules:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests

    - name: Run merge script
      run: |
        export TZ=Asia/Shanghai
        python merge_rules.py
        echo "规则更新时间: $(date +'%Y-%m-%d %H:%M:%S%:z')" >> update.log
        ls -la merged-filter.txt update.log
        if [ ! -f merged-filter.txt ]; then
          exit 1
        fi

    - name: Commit changes
      run: |
        export TZ=Asia/Shanghai
        git config --global --add safe.directory /github/workspace
        git config --global user.name "AutoUpdater[Bot]"
        git config --global user.email "916899380+autoupdater[bot]@users.noreply.github.com"
        git add merged-filter.txt update.log
        if git diff-index --quiet HEAD --; then
          echo "无变更可提交"
        else
          commit_time=$(date +'%Y-%m-%d %H:%M:%S%:z')
          git commit -m "自动更新规则: ${commit_time}"
          git push
        fi