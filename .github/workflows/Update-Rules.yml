# .github/workflows/update-rules.yml
name: Update Rules

on:
  schedule:
    - cron: "0 12 * * *" # 每天UTC时间12点运行（北京时间20点）
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Merge rules
      run: |
        python scripts/merge_rules.py
        python scripts/rule_count.py

    - name: Update README
      run: |
        RULE_COUNT=$(sed -n 's/^! Total count: //p' merged-filter.txt)
        UPDATE_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
        
        sed -i "s/更新时间:.*/更新时间: ${UPDATE_TIME}/g" README.md
        sed -i "s/拦截规则数量:.*/拦截规则数量: ${RULE_COUNT}/g" README.md
        sed -i "s/规则总数-{rule_count}/规则总数-${RULE_COUNT}/g" README.md

    - name: Commit changes
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add merged-filter.txt README.md rule_stats.json
        git commit -m "Auto-update: $(date +'%Y%m%d%H%M')" || echo "No changes"
        git push