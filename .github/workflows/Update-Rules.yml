name: Update Filter Rules

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 时间 0 点运行
  workflow_dispatch: # 手动触发工作流

jobs:
  update-rules:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests

    - name: Merge rules and update stats
      run: python merge_rules.py

    - name: Update README
      run: python update_readme.py

    - name: Commit changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add README.md rule_stats.json merged-filter.txt
        git commit -m "🔄 自动更新规则和统计信息"
        git push