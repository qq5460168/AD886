name: Update Rules

on:
  schedule:
    - cron: "0 0 * * *"  # 每日运行一次
  workflow_dispatch:  # 手动触发

jobs:
  update-rules:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.x

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Generate rule_stats.json
      run: |
        python -c "
        import json
        from datetime import datetime
        stats = {
            'rule_count': 12345,  # 替换为计算规则数量的逻辑
            'last_update': datetime.utcnow().strftime('%Y-%m-%d')
        }
        with open('rule_stats.json', 'w', encoding='utf-8') as f:
            json.dump(stats, f, ensure_ascii=False, indent=4)
        "

    - name: Commit and Push Changes
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add rule_stats.json
        git commit -m "Update rule_stats.json"
        git push