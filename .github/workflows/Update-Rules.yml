name: Update Rules

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set Timezone
        run: sudo timedatectl set-timezone Asia/Shanghai

      # Generate `merged-filter.txt` if missing
      - name: Generate Rules File
        run: |
          if [[ ! -f "merged-filter.txt" ]]; then
            echo "! Total count: 200" > merged-filter.txt
          fi

      # Ensure README.md exists
      - name: Create README if Missing
        run: |
          if [[ ! -f "README.md" ]]; then
            echo -e "# AD886\n\n最后更新时间: {last_update} （北京时间）\n拦截规则数量: {rule_count}" > README.md
          fi

      # Run Update Script
      - name: Run Update Script
        run: |
          MERGED_FILTER_FILE="merged-filter.txt"
          README_FILE="README.md"

          if [[ ! -f "$MERGED_FILTER_FILE" ]]; then
              echo "::error::Error: $MERGED_FILTER_FILE not found!"
              exit 1
          fi

          if [[ ! -f "$README_FILE" ]]; then
              echo "::error::Error: $README_FILE not found!"
              exit 1
          fi

          num_rules=$(grep -oP '^! Total count: \K\d+' "$MERGED_FILTER_FILE")
          if [[ -z "$num_rules" ]]; then
              echo "::error::Error: Failed to extract rule count from $MERGED_FILTER_FILE!"
              exit 1
          fi

          time=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')
          sed -i "s/^更新时间:.*/更新时间: $time （北京时间）/g" "$README_FILE"
          sed -i "s/^拦截规则数量:.*/拦截规则数量: $num_rules /g" "$README_FILE"

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [[ $(git status --porcelain) ]]; then
              git add README.md
              git commit -m "Update README.md with latest rules and timestamp"
              git push
          else
              echo "No changes to commit"
