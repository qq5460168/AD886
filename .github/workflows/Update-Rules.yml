name: Rules Auto-Update
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,12 * * *'

jobs:
  secure-update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read

    steps:
      # ...其他步骤保持不变...

      # ========== 清理阶段 ==========
      - name: Cleanup Workflow Runs
        uses: actions/delete-workflow-runs@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain-days: 3
          keep-minimum-runs: 10