name: Update Filter Rules

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 时间 0 点运行
  workflow_dispatch:

jobs:
  merge-rules:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # 更新到最新版本
      with:
        fetch-depth: 0          # 获取完整提交历史
        persist-credentials: true  # 保持认证信息

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests

    - name: Run merge script
      run: |
        python merge_rules.py
        echo "规则更新时间: $(date -u '+%Y-%m-%d %H:%M:%S')" >> update.log

    - name: Commit changes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 使用自动生成的 token
      run: |
        git config --global user.name "AutoUpdater[Bot]"
        git config --global user.email "916899380+autoupdater[bot]@users.noreply.github.com"
        
        # 检查是否有需要提交的变更
        git diff --quiet && git diff --staged --quiet || {
          git add merged-filter.txt update.log
          git commit -m "自动更新规则: $(date -u '+%Y-%m-%d')"
          git push origin HEAD:${{ github.ref }}
        }